name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # The SQL suites open a real server: they create and drop `coredata_migration_test`
    # around every test, and connect to 127.0.0.1 as root with no password, which is what
    # CONTRIBUTING asks a developer to provide locally.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: dom, intl, mbstring, pdo, pdo_mysql, libxml, apcu, redis, memcached
          ini-values: zend.assertions=1
          coverage: none

      # The stack is consumed from Packagist like any other application would
      # consume it. Resolving the siblings' master instead would test a combination
      # no user can install, and would fail this repository's CI whenever an
      # unrelated one committed.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root --silent && exit 0
            sleep 2
          done
          echo "MariaDB did not become ready" >&2
          exit 1

      - name: Run the test suite
        run: vendor/bin/phpunit --no-coverage

  analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: dom, intl, mbstring, pdo, pdo_mysql, libxml, apcu, redis, memcached
          ini-values: zend.assertions=1
          coverage: none

      # The stack is consumed from Packagist like any other application would
      # consume it. Resolving the siblings' master instead would test a combination
      # no user can install, and would fail this repository's CI whenever an
      # unrelated one committed.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Psalm
        run: vendor/bin/psalm --output-format=github --no-progress

      # Advisory, as CONTRIBUTING says: Rector proposes modernisations and not every
      # proposal is wanted, so its report informs a review rather than blocking one.
      - name: Rector
        continue-on-error: true
        run: vendor/bin/rector process src --dry-run --no-progress-bar
